runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  vpcAccess:
    connector: projects/hemobot-3cfbd/locations/us-central1/connectors/hemobot-connector
    egress: PRIVATE_RANGES_ONLY

env:
  - variable: GOOGLE_MAPS_API_KEY
    secret: GOOGLE_MAPS_API_KEY
    availability:
      - RUNTIME

  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME

  - variable: GMAIL_USER
    secret: GMAIL_USER
    availability:
      - RUNTIME

  - variable: GMAIL_APP_PASSWORD
    secret: GMAIL_APP_PASSWORD
    availability:
      - RUNTIME

  - variable: CONTACT_TO
    secret: CONTACT_TO
    availability:
      - RUNTIME
